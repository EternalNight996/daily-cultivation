name: ios-build

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'ui = 只出截图（快）；full = 截图 + 真机 IPA'
        type: choice
        options: [ui, full]
        default: ui

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      # 一边编译一边把模拟器开机，省掉后面 2–3 分钟的等待
      - name: Boot simulator in background
        if: github.event_name == 'workflow_dispatch'
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "simulator=$DEVICE"
          echo "SIM_DEVICE=$DEVICE" >> $GITHUB_ENV
          xcrun simctl boot "$DEVICE" || true

      # 复用上一次的 DerivedData：只重编改过的文件，冷构建 4.7 分钟 → 1–2 分钟
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            ios/build
            ios/TalismanKit/.build
          key: ddb-${{ github.run_id }}
          restore-keys: |
            ddb-

      - name: Build for simulator (no signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project DailyCultivation.xcodeproj \
            -scheme DailyCultivation \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Unit tests (TalismanKit)
        working-directory: ios/TalismanKit
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log

      - name: Build unsigned IPA (device)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project DailyCultivation.xcodeproj \
            -scheme DailyCultivation \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build-device.log
          rm -rf Payload DailyCultivation-unsigned.ipa
          mkdir Payload
          cp -R build-device/Build/Products/Release-iphoneos/DailyCultivation.app Payload/
          zip -qry DailyCultivation-unsigned.ipa Payload
          ls -la DailyCultivation-unsigned.ipa

      - name: Upload unsigned IPA
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ios/DailyCultivation-unsigned.ipa

      # 一次跑完所有 UI 状态，看设计不用再等第二轮
      - name: Capture UI states
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        working-directory: ios
        run: |
          DEVICE="${SIM_DEVICE:-$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')}"
          echo "device=$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b || true
          APP=$(find build/Build/Products -name "DailyCultivation.app" -maxdepth 3 | head -1)
          echo "app=$APP"
          xcrun simctl install "$DEVICE" "$APP"

          capture() {
            local name="$1"; shift
            xcrun simctl terminate "$DEVICE" com.dailycultivation.app >/dev/null 2>&1 || true
            xcrun simctl launch "$DEVICE" com.dailycultivation.app "$@" >/dev/null 2>&1 || true
            sleep 5
            xcrun simctl io "$DEVICE" screenshot "$name"
            echo "captured $name"
          }

          capture shot.png -dcPreviewState idle
          capture shot-onboarding.png -dcPreviewState onboarding
          capture shot-settings.png -dcPreviewState settings
          capture shot-settle.png -dcPreviewState settle
          capture shot-resting.png -dcPreviewState resting
          capture shot-history.png -dcPreviewState history
          capture shot-share.png -dcPreviewState share
          ls -la shot*.png

      - name: Export generated project
        working-directory: ios
        run: |
          ditto -c -k --sequesterRsrc --keepParent DailyCultivation.xcodeproj DailyCultivation.xcodeproj.zip
          ls -la DailyCultivation.xcodeproj.zip

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            ios/build.log
            ios/build-device.log
            ios/TalismanKit/test.log
            ios/shot*.png
            ios/DailyCultivation.xcodeproj.zip
