name: ios-build

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/**'
  workflow_dispatch:

# 同一分支只保留一次构建，新的 push 直接取消旧的，省 macOS 分钟
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build for simulator (no signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project DailyCultivation.xcodeproj \
            -scheme DailyCultivation \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Unit tests (TalismanKit)
        working-directory: ios/TalismanKit
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log

      # 真机自测用：产物不签名，Windows 上用 Sideloadly 以免费 Apple ID 重签后装进 iPhone。
      # 放在截图之前——出包只要 6–7 分钟，不用等模拟器那 5 分钟。
      - name: Build unsigned IPA (device)
        if: github.event_name == 'workflow_dispatch'
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project DailyCultivation.xcodeproj \
            -scheme DailyCultivation \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build-device.log
          rm -rf Payload DailyCultivation-unsigned.ipa
          mkdir Payload
          cp -R build-device/Build/Products/Release-iphoneos/DailyCultivation.app Payload/
          zip -qry DailyCultivation-unsigned.ipa Payload
          ls -la DailyCultivation-unsigned.ipa

      - name: Upload unsigned IPA
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ios/DailyCultivation-unsigned.ipa

      # 模拟器截图很费时间（约 5 分钟），放在最后，失败不影响出包
      - name: Run in simulator and screenshot
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        working-directory: ios
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "device=$DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b || true
          APP=$(find build/Build/Products -name "DailyCultivation.app" -maxdepth 3 | head -1)
          echo "app=$APP"
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" com.dailycultivation.app || true
          sleep 6
          xcrun simctl io "$DEVICE" screenshot shot.png
          ls -la shot.png

      - name: Export generated project
        working-directory: ios
        run: |
          ditto -c -k --sequesterRsrc --keepParent DailyCultivation.xcodeproj DailyCultivation.xcodeproj.zip
          ls -la DailyCultivation.xcodeproj.zip

      - name: Upload logs and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            ios/build.log
            ios/build-device.log
            ios/TalismanKit/test.log
            ios/shot.png
            ios/DailyCultivation.xcodeproj.zip
