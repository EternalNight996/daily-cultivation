<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>风格测试</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0b0c0d;font-family:-apple-system,"PingFang SC",sans-serif;
    display:flex;gap:34px;justify-content:center;padding:30px;color:#eee}
  .col{display:flex;flex-direction:column;gap:12px;align-items:center}
  .cap{font-size:12px;letter-spacing:.12em;color:rgba(255,255,255,.55)}
  .phone{position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;
    outline:1px solid rgba(255,255,255,.12);box-shadow:0 0 0 9px #121416}

  /* ============ A · 水墨电影 ============ */
  .a{background:linear-gradient(180deg,#E9EDE8 0%,#D3DBD4 26%,#B6C2BA 48%,#8C9B93 70%,#6A7872 100%)}
  .a .sun{position:absolute;left:62%;top:120px;width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle,#FFFDF2 0%,rgba(255,250,232,.65) 42%,rgba(255,250,232,0) 70%)}
  .a .far{position:absolute;left:0;right:0;bottom:0;height:520px;opacity:.55;
    background:linear-gradient(180deg,rgba(70,84,80,0) 0%,rgba(70,84,80,.35) 40%,rgba(52,64,60,.75) 100%)}
  .a .m1,.a .m2,.a .m3{position:absolute;left:0;right:0;bottom:0}
  .a .m1{height:300px;background:linear-gradient(180deg,rgba(96,112,106,.55),rgba(74,90,84,.9));
    clip-path:polygon(0 62%,12% 40%,22% 55%,34% 28%,46% 52%,58% 34%,70% 56%,82% 38%,93% 54%,100% 44%,100% 100%,0 100%)}
  .a .m2{height:230px;background:linear-gradient(180deg,rgba(58,72,67,.85),rgba(40,52,48,.96));
    clip-path:polygon(0 70%,10% 50%,24% 66%,38% 40%,52% 64%,66% 46%,80% 68%,92% 52%,100% 62%,100% 100%,0 100%)}
  .a .m3{height:140px;background:#232C29;
    clip-path:polygon(0 78%,16% 62%,30% 76%,46% 56%,62% 78%,78% 62%,92% 80%,100% 72%,100% 100%,0 100%)}
  .a .mist{position:absolute;left:-60px;right:-60px;height:120px;filter:blur(22px);
    background:radial-gradient(closest-side,rgba(255,255,255,.55),transparent)}
  .a .mist.x{top:430px}
  .a .mist.y{top:560px;opacity:.6}
  .a .title{position:absolute;left:26px;top:64px;writing-mode:vertical-rl;
    font-family:"Songti SC",serif;font-size:34px;letter-spacing:.28em;color:#1E2422;
    text-shadow:0 1px 0 rgba(255,255,255,.4)}
  .a .chop{position:absolute;left:30px;top:250px;width:26px;height:26px;background:#9E3B2E;
    color:#F6E9D8;font-family:"Songti SC",serif;font-size:15px;display:flex;
    align-items:center;justify-content:center;border-radius:3px}
  .a .talisman{position:absolute;left:50%;top:470px;transform:translate(-50%,-50%);
    width:250px;height:250px}
  .a .talisman path{fill:none;stroke:#2A2F2C;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;opacity:.88}
  .a .seal{position:absolute;right:64px;bottom:214px;width:46px;height:46px;background:#9E3B2E;
    color:#F6E9D8;font-family:"Songti SC",serif;font-size:22px;display:flex;align-items:center;
    justify-content:center;border-radius:3px;transform:rotate(-6deg)}
  .a .hud{position:absolute;left:26px;bottom:40px;font-size:11px;letter-spacing:.2em;color:rgba(30,36,34,.72)}
  .a .btn{position:absolute;right:22px;bottom:34px;width:52px;height:52px;border-radius:50%;
    border:1px solid rgba(30,36,34,.35);display:flex;align-items:center;justify-content:center;
    font-family:"Songti SC",serif;font-size:11px;color:#1E2422;background:rgba(255,255,255,.35)}

  /* ============ B · 黄纸夜灯 ============ */
  .b{background:radial-gradient(120% 80% at 76% 6%,#3A2A1C 0%,#1B1512 46%,#0C0A09 100%)}
  .b .lamp{position:absolute;right:-40px;top:-30px;width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,196,110,.55),rgba(255,170,80,.12) 45%,transparent 70%);
    filter:blur(6px)}
  .b .table{position:absolute;left:-10%;right:-10%;bottom:0;height:190px;
    background:linear-gradient(180deg,rgba(60,44,32,.0) 0%,rgba(50,36,26,.85) 30%,#241A14 100%)}
  .b .paper{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-2deg);
    width:236px;height:330px;background:linear-gradient(160deg,#EFE0BE 0%,#E2CFA6 52%,#D3BC8E 100%);
    box-shadow:0 18px 40px rgba(0,0,0,.55),inset 0 0 60px rgba(120,84,40,.22);
    clip-path:polygon(0 2%,22% 0,48% 2.5%,74% 0,100% 3%,98.5% 27%,100% 52%,98% 76%,100% 98%,
      72% 100%,46% 97.5%,22% 100%,0 97%,1.5% 72%,0 46%,2% 24%)}
  .b .paper svg{position:absolute;inset:0}
  .b .paper path{fill:none;stroke:#8E2F22;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
  .b .seal{position:absolute;right:38px;bottom:250px;width:42px;height:42px;background:#8E2F22;
    color:#F2DFC2;font-family:"Songti SC",serif;font-size:20px;display:flex;align-items:center;
    justify-content:center;border-radius:2px;transform:rotate(-8deg);box-shadow:0 6px 14px rgba(0,0,0,.5)}
  .b .title{position:absolute;left:24px;top:60px;writing-mode:vertical-rl;font-family:"Songti SC",serif;
    font-size:30px;letter-spacing:.24em;color:#EFE3C9;text-shadow:0 2px 14px rgba(0,0,0,.6)}
  .b .hud{position:absolute;left:24px;bottom:38px;font-size:11px;letter-spacing:.2em;color:rgba(239,227,201,.55)}
  .b .btn{position:absolute;right:20px;bottom:32px;width:52px;height:52px;border-radius:50%;
    border:1px solid rgba(239,227,201,.3);display:flex;align-items:center;justify-content:center;
    font-family:"Songti SC",serif;font-size:11px;color:#EFE3C9;background:rgba(20,14,10,.5)}
  .b .dust{position:absolute;inset:0;opacity:.5;
    background-image:radial-gradient(1.4px 1.4px at 30% 30%,rgba(255,214,150,.6),transparent),
      radial-gradient(1.2px 1.2px at 66% 24%,rgba(255,214,150,.45),transparent),
      radial-gradient(1.6px 1.6px at 52% 62%,rgba(255,214,150,.4),transparent),
      radial-gradient(1px 1px at 78% 52%,rgba(255,214,150,.35),transparent)}
</style></head>
<body>
  <div class="col">
    <div class="phone a">
      <div class="sun"></div>
      <div class="far"></div>
      <div class="m1"></div><div class="m2"></div><div class="m3"></div>
      <div class="mist x"></div><div class="mist y"></div>
      <div class="title">每日修仙</div>
      <div class="chop">每</div>
      <svg class="talisman" viewBox="0 0 250 250">
        <path d="M125 20 L125 120 L125 210"/>
        <path d="M55 78 L195 78 L200 92"/>
        <path d="M62 128 L188 132 L192 146"/>
      </svg>
      <div class="seal">敕</div>
      <div class="hud">第 7 日 · 筑基 · 午时</div>
      <div class="btn">灵镜</div>
    </div>
    <div class="cap">A · 水墨电影（剑来 / 凡人 的远景层）</div>
  </div>

  <div class="col">
    <div class="phone b">
      <div class="lamp"></div>
      <div class="dust"></div>
      <div class="table"></div>
      <div class="title">每日修仙</div>
      <div class="paper">
        <svg viewBox="0 0 236 330">
          <path d="M118 34 L118 150 L118 292"/>
          <path d="M56 96 L180 100 L186 114"/>
          <path d="M60 168 L176 172 L182 186"/>
          <path d="M74 232 L162 236"/>
        </svg>
      </div>
      <div class="seal">敕</div>
      <div class="hud">第 7 日 · 筑基 · 午时</div>
      <div class="btn">灵镜</div>
    </div>
    <div class="cap">B · 黄纸夜灯（凡人百世书的近景层）</div>
  </div>
</body></html>
