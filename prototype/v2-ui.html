<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>每日修仙 · V2 视觉稿</title>
<style>
  :root{
    --gold:#C9A45C; --gold-soft:rgba(201,164,92,.55); --jade:#6FBFB0;
    --ink:#0A0F12; --paper:#EDE6D6; --cinnabar:#A63B2E;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:#07090B;color:var(--paper);
    font-family:-apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif}
  .wrap{display:flex;justify-content:center;padding:28px}
  .phone{position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;
    background:#05080A;outline:1px solid rgba(255,255,255,.10);
    box-shadow:0 0 0 10px #101216,0 0 0 11px rgba(255,255,255,.06)}
  .notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);
    width:112px;height:30px;border-radius:16px;background:#000;z-index:60}

  /* ---------- 山水场景 ---------- */
  .scene{position:absolute;inset:0;overflow:hidden;
    background:linear-gradient(180deg,#0E1A1F 0%,#0B1418 38%,#080D10 72%,#05080A 100%)}
  .moon{position:absolute;left:50%;top:126px;width:48px;height:48px;margin-left:-24px;border-radius:50%;
    background:radial-gradient(circle at 40% 38%, #FBF1D8 0%, #E7D4AC 48%, #C9A45C 74%, rgba(201,164,92,0) 76%);
    opacity:.82;filter:blur(.3px)}
  .moon:after{content:"";position:absolute;inset:-34px;border-radius:50%;
    background:radial-gradient(circle,rgba(242,223,184,.16),transparent 68%)}
  .hills{position:absolute;left:0;right:0;bottom:0;width:390px;height:520px}
  .mist{position:absolute;border-radius:50%;filter:blur(26px);opacity:.5}
  .mist.a{left:-80px;top:300px;width:420px;height:170px;
    background:radial-gradient(closest-side,rgba(190,215,210,.16),transparent)}
  .mist.b{right:-120px;top:420px;width:460px;height:190px;
    background:radial-gradient(closest-side,rgba(190,215,210,.12),transparent)}
  .stars{position:absolute;inset:0;opacity:.5;
    background-image:radial-gradient(1px 1px at 18% 12%,rgba(255,255,255,.5),transparent),
      radial-gradient(1px 1px at 72% 8%,rgba(255,255,255,.35),transparent),
      radial-gradient(1px 1px at 38% 22%,rgba(255,255,255,.3),transparent),
      radial-gradient(1.4px 1.4px at 84% 26%,rgba(255,255,255,.4),transparent),
      radial-gradient(1px 1px at 12% 32%,rgba(255,255,255,.25),transparent)}
  .grade{position:absolute;inset:0;mix-blend-mode:overlay;opacity:.5;transition:background .9s}
  .vign{position:absolute;inset:0;
    background:radial-gradient(78% 58% at 50% 42%,transparent 34%,rgba(0,0,0,.66) 100%)}

  /* 相机模式 */
  body.cam-on .hills{opacity:.18;filter:blur(2px)}
  body.cam-on .moon{opacity:.25}
  body.cam-on .scene{background:linear-gradient(180deg,#1A2024 0%,#12181C 50%,#0A0E11 100%)}
  .frame{position:absolute;inset:70px 40px 120px;display:none;pointer-events:none}
  body.cam-on .frame{display:block}
  .frame i{position:absolute;width:26px;height:26px;border:1px solid rgba(237,230,214,.5)}
  .frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
  .frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
  .frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
  .frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}

  /* ---------- 顶部 ---------- */
  .top{position:absolute;left:20px;right:20px;top:54px;z-index:40;display:flex;
    align-items:flex-start;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:10px}
  .chop{width:30px;height:30px;border-radius:4px;background:var(--cinnabar);
    display:flex;align-items:center;justify-content:center;flex:none;
    font-family:"Songti SC","STSong",serif;font-size:17px;color:#F3E3D0;
    box-shadow:inset 0 0 0 1px rgba(255,240,220,.28)}
  .brand h1{margin:0;font-family:"Songti SC","STSong",serif;font-weight:400;
    font-size:19px;letter-spacing:.22em;color:rgba(240,232,214,.94)}
  .brand p{margin:3px 0 0;font-size:10.5px;letter-spacing:.16em;color:rgba(237,230,214,.42)}
  .hud{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .pill{display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;
    background:rgba(8,12,14,.5);border:1px solid rgba(237,230,214,.12);
    font-size:11.5px;letter-spacing:.06em;color:rgba(237,230,214,.8);backdrop-filter:blur(6px)}
  .pill i{width:6px;height:6px;border-radius:50%;background:var(--gold)}
  .pill em{font-style:normal;color:var(--gold)}
  .qi{text-align:right;font-size:10px;letter-spacing:.14em;color:rgba(237,230,214,.38)}
  .qi b{font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:.04em}
  .qi .bar{width:112px;height:2px;margin-top:5px;background:rgba(237,230,214,.12);border-radius:2px;overflow:hidden}
  .qi .bar span{display:block;height:100%;width:23%;background:linear-gradient(90deg,var(--gold-soft),var(--gold))}

  /* ---------- 符盘 ---------- */
  .plate{position:absolute;left:50%;top:400px;width:304px;height:304px;
    transform:translate(-50%,-50%);border-radius:50%;z-index:30;touch-action:none}
  .plate-ring{position:absolute;inset:0;border-radius:50%;
    border:1px solid rgba(201,164,92,.16);
    background:radial-gradient(circle at 50% 44%,rgba(24,28,30,.42),rgba(8,10,12,.10) 58%,transparent 72%)}
  .plate-ring:after{content:"";position:absolute;inset:22px;border-radius:50%;
    border:1px solid rgba(237,230,214,.05)}
  .ticks{position:absolute;inset:-2px;border-radius:50%}
  .ticks i{position:absolute;left:50%;top:0;width:1px;height:7px;background:rgba(201,164,92,.35);
    transform-origin:50% 153px}
  .ticks i:nth-child(1){transform:translateX(-50%) rotate(0deg)}
  .ticks i:nth-child(2){transform:translateX(-50%) rotate(90deg)}
  .ticks i:nth-child(3){transform:translateX(-50%) rotate(180deg)}
  .ticks i:nth-child(4){transform:translateX(-50%) rotate(270deg)}
  .ring-score{position:absolute;inset:-16px;border-radius:50%;transform:rotate(-90deg)}
  .ring-score circle{fill:none;stroke-width:1.5;stroke-linecap:round}
  .guide{position:absolute;inset:0;width:390px;height:844px;overflow:visible;z-index:31;pointer-events:none}
  .guide .dash{fill:none;stroke:rgba(237,230,214,.55);stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 9;animation:flow 2.4s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-30}}
  .guide .done{fill:none;stroke:rgba(201,164,92,.6);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .guide .faint{fill:none;stroke:rgba(237,230,214,.14);stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 10}
  .startdot{position:absolute;z-index:33;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
    background:radial-gradient(circle,#FFF6DE 0 20%,rgba(201,164,92,.9) 42%,rgba(201,164,92,0) 72%);
    animation:pulse 1.8s ease-in-out infinite;pointer-events:none}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.35);opacity:.5}}
  .halo{position:absolute;z-index:30;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;
    border:1px solid rgba(201,164,92,.22);pointer-events:none}
  #trail{position:absolute;inset:0;z-index:32;pointer-events:none}
  .plate-name{position:absolute;left:0;right:0;top:500px;text-align:center;z-index:34;
    font-family:"Songti SC","STSong",serif;font-size:11px;letter-spacing:.24em;
    color:rgba(237,230,214,.30);pointer-events:none}
  .hint{position:absolute;left:0;right:0;bottom:150px;text-align:center;font-size:12.5px;
    letter-spacing:.1em;color:rgba(237,230,214,.45);z-index:25;transition:opacity .4s}

  /* ---------- 宠物 ---------- */
  .pet{position:absolute;left:16px;bottom:206px;width:96px;height:96px;z-index:35;
    transition:bottom .5s cubic-bezier(.3,1.2,.4,1)}
  .pet svg{width:100%;height:100%;overflow:visible}
  .pet .body-fill{fill:#161E22;stroke:rgba(201,164,92,.45);stroke-width:1}
  .pet .ear{fill:#161E22;stroke:rgba(201,164,92,.45);stroke-width:1}
  .pet .eye{fill:#EFE3C4;transition:transform .12s ease-out}
  .pet .glow{fill:rgba(201,164,92,.14)}
  .pet.bounce{animation:bounce .55s cubic-bezier(.3,1.6,.5,1)}
  @keyframes bounce{0%{transform:translateY(0)}38%{transform:translateY(-14px)}100%{transform:translateY(0)}}

  /* ---------- 灵镜按钮 ---------- */
  .cam{position:absolute;right:16px;bottom:120px;z-index:38;display:flex;flex-direction:column;gap:10px;align-items:center}
  .cam button{width:56px;height:56px;border-radius:50%;border:1px solid rgba(201,164,92,.4);
    background:rgba(10,14,16,.66);color:var(--gold);font-family:"Songti SC",serif;
    font-size:11px;letter-spacing:.1em;cursor:pointer;backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;line-height:1.2;padding:0}
  .cam button.small{width:44px;height:44px;font-size:10px;opacity:.9}
  .cam button[hidden]{display:none}
  .cam button:active{transform:scale(.96)}

  /* ---------- 结算 ---------- */
  .flash{position:absolute;inset:0;background:#FFF6E2;opacity:0;z-index:50;pointer-events:none}
  .settle{position:absolute;left:0;right:0;bottom:0;z-index:55;padding:22px 20px 30px;
    background:linear-gradient(180deg,rgba(8,12,14,.5) 0%,rgba(6,9,11,.95) 16%,rgba(4,6,8,.995) 100%);
    backdrop-filter:blur(10px);border-top:1px solid rgba(237,230,214,.08);
    transform:translateY(105%);transition:transform .42s cubic-bezier(.22,.9,.3,1)}
  .settle.on{transform:translateY(0)}
  .settle .cap{font-family:"Songti SC",serif;font-size:12px;letter-spacing:.26em;
    color:rgba(237,230,214,.5);margin-bottom:14px}
  .num{display:flex;align-items:baseline;gap:8px;margin-bottom:18px}
  .num b{font-size:52px;line-height:1;font-weight:300;color:var(--gold);font-variant-numeric:tabular-nums}
  .num span{font-size:12px;letter-spacing:.18em;color:rgba(237,230,214,.5)}
  .rows{display:grid;gap:9px;margin-bottom:20px}
  .row{display:flex;justify-content:space-between;font-size:13px;color:rgba(237,230,214,.66)}
  .row b{color:rgba(237,230,214,.92);font-weight:500;font-variant-numeric:tabular-nums}
  .row .up{color:var(--jade)}
  .actions{display:flex;gap:10px}
  .btn{flex:1;height:46px;border-radius:12px;border:1px solid rgba(201,164,92,.4);
    background:rgba(201,164,92,.10);color:var(--gold);font-size:14px;letter-spacing:.12em;
    cursor:pointer;font-family:inherit}
  .btn.ghost{border-color:rgba(237,230,214,.14);background:transparent;color:rgba(237,230,214,.6)}

  .seal{position:absolute;left:calc(50% + 46px);top:452px;width:36px;height:36px;z-index:36;
    display:flex;align-items:center;justify-content:center;
    font-family:"Songti SC",serif;font-size:18px;color:#F3E3D0;background:var(--cinnabar);
    border-radius:3px;opacity:0;box-shadow:inset 0 0 0 1px rgba(255,240,220,.25);
    transform:rotate(-14deg) scale(2.2);pointer-events:none}
  .seal.drop{animation:sealDrop .46s cubic-bezier(.2,1.5,.4,1) forwards}
  @keyframes sealDrop{
    0%{opacity:0;transform:rotate(-16deg) scale(2.4)}
    55%{opacity:1;transform:rotate(-5deg) scale(.94)}
    100%{opacity:.92;transform:rotate(-6deg) scale(1)}}
  .ink{position:absolute;left:50%;top:400px;width:360px;height:360px;margin:-180px 0 0 -180px;
    border-radius:50%;z-index:29;pointer-events:none;opacity:0;transform:scale(.4);
    background:radial-gradient(circle,rgba(201,164,92,.22) 0%,rgba(201,164,92,.06) 42%,transparent 70%)}
  .ink.bloom{animation:inkBloom 1.1s cubic-bezier(.16,.84,.32,1) forwards}
  @keyframes inkBloom{0%{opacity:0;transform:scale(.35)}35%{opacity:.95;transform:scale(1.05)}100%{opacity:0;transform:scale(1.25)}}

  body.still *,body.still *:before,body.still *:after{transition:none!important;animation:none!important}
  .dev{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="phone" id="phone">
    <div class="notch"></div>

    <div class="scene">
      <div class="stars"></div>
      <div class="moon"></div>
      <svg class="hills" viewBox="0 0 390 520" preserveAspectRatio="xMidYMax slice">
        <path d="M0 320 L54 258 L96 300 L150 214 L204 296 L246 246 L298 306 L342 262 L390 318 L390 520 L0 520 Z"
              fill="#0D181D" opacity="0.95"/>
        <path d="M0 372 L46 330 L102 366 L158 306 L214 372 L268 330 L320 380 L390 336 L390 520 L0 520 Z"
              fill="#080F12" opacity="0.92"/>
        <path d="M0 430 L70 396 L140 434 L210 392 L280 438 L350 402 L390 424 L390 520 L0 520 Z"
              fill="#050A0C"/>
      </svg>
      <div class="mist a"></div>
      <div class="mist b"></div>
    </div>

    <div class="grade" id="grade"></div>
    <div class="vign"></div>
    <div class="frame"><i></i><i></i><i></i><i></i></div>
    <div class="ink" id="ink"></div>

    <header class="top">
      <div class="brand">
        <div class="chop">每</div>
        <div>
          <h1>每日修仙</h1>
          <p id="streak">第 7 日 · 筑基</p>
        </div>
      </div>
      <div class="hud">
        <div class="pill" id="pill"><i></i><span id="pillText">午时 · 离火</span><em id="pillMult">×1.5</em></div>
        <div class="qi">今日灵气 <b id="qiNow">139</b><i>/ 600</i>
          <div class="bar"><span id="qiBar"></span></div>
        </div>
      </div>
    </header>

    <div class="plate" id="plate">
      <div class="plate-ring"></div>
      <div class="ticks"><i></i><i></i><i></i><i></i></div>
      <svg class="ring-score" viewBox="0 0 322 322" id="scoreRing">
        <circle cx="161" cy="161" r="158" stroke="rgba(237,230,214,.07)"></circle>
        <circle id="scoreArc" cx="161" cy="161" r="158" stroke="#C9A45C"
          stroke-dasharray="993" stroke-dashoffset="993"
          style="opacity:0;transition:stroke-dashoffset .18s linear,stroke .3s,opacity .2s"></circle>
      </svg>
    </div>

    <svg class="guide" viewBox="0 0 390 844" preserveAspectRatio="none" id="guide"></svg>
    <div class="halo" id="halo"></div>
    <div class="startdot" id="startdot"></div>
    <canvas id="trail" width="390" height="844"></canvas>

    <div class="plate-name" id="plateName">清心符 · 3 笔</div>
    <div class="hint" id="hint">从光点起笔，沿虚线画</div>

    <div class="pet" id="pet">
      <svg viewBox="0 0 96 96">
        <ellipse class="glow" cx="48" cy="86" rx="26" ry="5"></ellipse>
        <path class="ear" d="M26 34 L20 12 L40 24 Z"></path>
        <path class="ear" d="M70 34 L76 12 L56 24 Z"></path>
        <ellipse class="body-fill" cx="48" cy="52" rx="30" ry="27"></ellipse>
        <circle class="eye" id="eyeL" cx="38" cy="50" r="4.2"></circle>
        <circle class="eye" id="eyeR" cx="58" cy="50" r="4.2"></circle>
      </svg>
    </div>

    <div class="cam">
      <button id="camToggle">灵镜</button>
      <button id="camFlip" class="small" hidden>翻转</button>
      <button id="camShot" class="small" hidden>留影</button>
      <button id="demoStroke" class="small">示范</button>
    </div>

    <div class="seal" id="seal">敕</div>
    <div class="flash" id="flash"></div>

    <div class="settle" id="settle">
      <div class="cap">符成 · 灵气入体</div>
      <div class="num"><b id="xpNum">0</b><span>灵气</span></div>
      <div class="rows">
        <div class="row"><span>基础灵气</span><b>80</b></div>
        <div class="row"><span id="rShichen">午时 · 离火</span><b class="up" id="rMult">×1.50</b></div>
        <div class="row"><span>连续 7 天</span><b class="up">+5%</b></div>
        <div class="row"><span>阿团共鸣</span><b class="up">+10%</b></div>
        <div class="row"><span>今日已得</span><b id="rToday">0</b></div>
      </div>
      <div class="actions">
        <button class="btn" id="again">再画一道</button>
        <button class="btn ghost" id="close">收下</button>
      </div>
    </div>

    <div class="dev">
      <div class="seg" id="segTalisman">
        <button data-i="0" class="on">清心符</button><button data-i="1">聚灵符</button><button data-i="2">御风符</button>
      </div>
      <div class="seg" id="segShichen">
        <button data-i="0" class="on">午</button><button data-i="1">子</button><button data-i="2">卯</button>
        <button data-i="3">酉</button><button data-i="4">无常</button>
      </div>
      <input type="range" id="thr" min="0.50" max="0.95" step="0.01" value="0.72">
      <b id="thrVal">0.72</b>
      <div class="toggle on" id="tScore"></div>
      <div class="toggle on" id="tGuide"></div>
      <span id="sScore"></span><span id="sThr"></span><span id="sTotal"></span>
      <span id="sToday"></span><span id="sTime"></span><span id="sProg"></span>
    </div>
  </div>
</div>

<script>

/* ============ 基础几何 ============ */
const CX = 195, CY = 400, BOX = 292, R = 152;
const toScreen = (p) => ({ x: CX + (p[0] - .5) * BOX, y: CY + (p[1] - .5) * BOX });

/* ============ 三张符（归一化点列） ============ */
function arc(cx, cy, rx, ry, a0, a1, n = 14) {
  const out = [];
  for (let i = 0; i <= n; i++) {
    const t = a0 + (a1 - a0) * i / n;
    out.push([cx + Math.cos(t) * rx, cy + Math.sin(t) * ry]);
  }
  return out;
}
function quad(p0, p1, p2, n = 12) {
  const out = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    out.push([u*u*p0[0] + 2*u*t*p1[0] + t*t*p2[0], u*u*p0[1] + 2*u*t*p1[1] + t*t*p2[1]]);
  }
  return out;
}
const TALISMANS = [
  { name:'清心符', multName:'离火', strokes:[
      [[.50,.10],[.50,.30],[.50,.50],[.49,.68],[.46,.84]],
      [[.26,.32],[.54,.32],[.70,.34],[.76,.39]],
      [[.28,.53],[.52,.53],[.68,.56],[.72,.61]]
  ]},
  { name:'聚灵符', multName:'玄水', strokes:[
      [[.28,.07],[.72,.07],[.72,.11],[.50,.11],[.50,.30]],
      [[.34,.34],[.66,.34],[.66,.56],[.34,.56],[.34,.34]],
      [[.28,.62],[.72,.62],[.72,.66],[.36,.66],[.36,.70],[.64,.70],[.64,.78],[.38,.86]]
  ]},
  { name:'御风符', multName:'青木', strokes:[
      arc(.50,.28,.20,.15,-Math.PI*.9, Math.PI*.2, 16),
      [[.18,.56],[.34,.50],[.50,.58],[.66,.50],[.82,.58]],
      [[.50,.58],[.50,.72],[.46,.82],[.36,.88]]
  ]}
];

/* ============ 重采样 / 归一化 / 打分 ============ */
function resample(pts, n = 32) {
  if (pts.length < 2) return pts.slice();
  const d = [0];
  for (let i = 1; i < pts.length; i++) {
    d.push(d[i-1] + Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y));
  }
  const total = d[d.length-1] || 1, step = total / (n - 1);
  const out = [pts[0]]; let j = 0;
  for (let k = 1; k < n - 1; k++) {
    const target = step * k;
    while (j < d.length - 2 && d[j+1] < target) j++;
    const seg = (d[j+1] - d[j]) || 1, t = (target - d[j]) / seg;
    out.push({ x: pts[j].x + (pts[j+1].x - pts[j].x) * t,
               y: pts[j].y + (pts[j+1].y - pts[j].y) * t });
  }
  out.push(pts[pts.length-1]);
  return out;
}
function bbox(pts) {
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for (const p of pts) { x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x); y1=Math.max(y1,p.y); }
  return {x0,y0,x1,y1,w:x1-x0,h:y1-y0};
}
function normalize(pts) {
  const b = bbox(pts), s = 1 / Math.max(b.w, b.h, 1e-6);
  const cx = (b.x0+b.x1)/2, cy = (b.y0+b.y1)/2;
  return pts.map(p => ({ x: (p.x-cx)*s + .5, y: (p.y-cy)*s + .5 }));
}
function frechet(P, Q) {
  const n = P.length, m = Q.length;
  let prev = new Float64Array(m).fill(1e9), cur = new Float64Array(m).fill(1e9);
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < m; j++) {
      const d = Math.hypot(P[i].x-Q[j].x, P[i].y-Q[j].y);
      if (i===0 && j===0) cur[j]=d;
      else if (i===0) cur[j]=Math.max(cur[j-1],d);
      else if (j===0) cur[j]=Math.max(prev[j],d);
      else cur[j]=Math.max(Math.min(prev[j],prev[j-1],cur[j-1]),d);
    }
    const t=prev; prev=cur; cur=t; cur.fill(1e9);
  }
  return prev[m-1];
}
function tangents(pts) {
  return pts.map((p,i) => {
    const a = pts[Math.max(0,i-1)], b = pts[Math.min(pts.length-1,i+1)];
    const dx = b.x-a.x, dy = b.y-a.y, L = Math.hypot(dx,dy) || 1;
    return { x: dx/L, y: dy/L };
  });
}
// 用户笔画映射到符的局部坐标系（0..1），与模板同一坐标系比较；
// 不做按单笔包围盒缩放——那样任何一条竖线都会被归一成满分。
function score(userRaw, tmplRaw) {
  const toBox = p => ({ x: (p.x - (CX - BOX/2)) / BOX, y: (p.y - (CY - BOX/2)) / BOX });
  const U = resample(userRaw.map(toBox), 32);
  const T = resample(tmplRaw.map(p=>({x:p[0],y:p[1]})), 32);
  const fr = frechet(U, T);
  const shape = Math.max(0, 1 - fr / 0.22);
  const ut = tangents(U), tt = tangents(T);
  let tan = 0;
  for (let i=0;i<32;i++) tan += Math.max(0, (ut[i].x*tt[i].x + ut[i].y*tt[i].y + 1) / 2);
  tan /= 32;
  const endTol = 40 / BOX;   // 与"起笔容差 40pt"同口径
  const d0 = Math.hypot(U[0].x-T[0].x, U[0].y-T[0].y);
  const d1 = Math.hypot(U[31].x-T[31].x, U[31].y-T[31].y);
  const ends = (Math.max(0,1-d0/endTol) + Math.max(0,1-d1/endTol)) / 2;
  return { total: 0.60*shape + 0.25*tan + 0.15*ends, shape, tan, ends, fr };
}

/* ============ 状态 ============ */
const DEMO = new URLSearchParams(location.search).get('demo') === '1';
const S = {
  talisman: 0, shichen: 0, threshold: 0.72,
  strokes: [], current: null, done: 0,
  today: 0, showScore: true, showGuide: true, startedAt: 0
};
const SHICHEN = [
  { label:'午时 · 离火', mult:1.5, grade:'radial-gradient(circle at 50% 40%, rgba(255,170,90,.30), rgba(120,60,30,.16) 60%, transparent 78%)', dot:'#E8A45C' },
  { label:'子时 · 玄水', mult:1.6, grade:'radial-gradient(circle at 50% 40%, rgba(120,170,255,.26), rgba(30,60,120,.18) 60%, transparent 78%)', dot:'#7FA8E8' },
  { label:'卯时 · 青木', mult:1.3, grade:'radial-gradient(circle at 50% 40%, rgba(140,220,170,.24), rgba(30,100,70,.16) 60%, transparent 78%)', dot:'#7FD0A8' },
  { label:'酉时 · 白金', mult:1.3, grade:'radial-gradient(circle at 50% 40%, rgba(220,220,240,.24), rgba(90,90,120,.16) 60%, transparent 78%)', dot:'#C8C8E0' },
  { label:'无常 · 平', mult:1.0, grade:'radial-gradient(circle at 50% 40%, rgba(200,200,200,.16), rgba(60,60,60,.12) 60%, transparent 78%)', dot:'#9AA0A6' }
];

/* ============ DOM ============ */
const $ = id => document.getElementById(id);
const phone = $('phone'), plate = $('plate'), canvas = $('trail'), ctx = canvas.getContext('2d');
const guide = $('guide'), startdot = $('startdot'), halo = $('halo');
const arcEl = $('scoreArc'), settle = $('settle'), flash = $('flash');
const pet = $('pet'), eyeL = $('eyeL'), eyeR = $('eyeR');
const hint = $('hint');

/* ============ 绘制：符盘 ============ */
function svgPath(points, closed) {
  return points.map((p,i) => {
    const s = toScreen(p);
    return (i ? 'L' : 'M') + s.x.toFixed(1) + ' ' + s.y.toFixed(1);
  }).join(' ') + (closed ? ' Z' : '');
}
function renderGuide() {
  const t = TALISMANS[S.talisman];
  guide.innerHTML = '';
  t.strokes.forEach((st, i) => {
    const el = document.createElementNS('http://www.w3.org/2000/svg','path');
    el.setAttribute('d', svgPath(st));
    if (i < S.done) el.setAttribute('class', 'done');
    else if (i === S.done) { el.setAttribute('class', 'dash'); el.style.opacity = S.showGuide ? 1 : .2; }
    else { el.setAttribute('class', 'faint'); el.style.opacity = S.showGuide ? 1 : .25; }
    guide.appendChild(el);
  });
  const done = S.done >= t.strokes.length;
  if (done) {
    startdot.style.display = 'none';
    halo.style.display = 'none';
  } else {
    const p = toScreen(t.strokes[S.done][0]);
    startdot.style.display = 'block';
    halo.style.display = 'block';
    startdot.style.cssText = 'left:'+p.x+'px;top:'+p.y+'px;' + (S.showGuide?'':'opacity:0');
    halo.style.cssText = 'left:'+p.x+'px;top:'+p.y+'px;' + (S.showGuide?'':'opacity:0');
  }
  $('sProg').textContent = S.done + ' / ' + t.strokes.length;
}

/* ============ 绘制：拖尾 ============ */
function drawTrail() {
  ctx.clearRect(0,0,390,844);
  const pts = S.current ? S.current.pts : [];
  if (pts.length < 2) return;
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 1; i < pts.length; i++) {
    const k = i / pts.length;
    const w = 1.4 + 4.6 * Math.pow(k, 1.15);
    const g = ctx.createLinearGradient(pts[i-1].x, pts[i-1].y, pts[i].x, pts[i].y);
    g.addColorStop(0, 'rgba(201,164,92,' + (0.20 + 0.5*k) + ')');
    g.addColorStop(1, 'rgba(255,244,214,' + (0.30 + 0.6*k) + ')');
    ctx.strokeStyle = g; ctx.lineWidth = w; ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(255,226,160,.85)'; ctx.shadowBlur = 9 + 7*k;
    ctx.beginPath(); ctx.moveTo(pts[i-1].x, pts[i-1].y); ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();
  }
  const last = pts[pts.length-1];
  ctx.shadowBlur = 22; ctx.fillStyle = 'rgba(255,248,230,.95)';
  ctx.beginPath(); ctx.arc(last.x, last.y, 4.2, 0, 7); ctx.fill();
  ctx.shadowBlur = 0;
}

/* ============ 契合度环 ============ */
const RING_C = 2 * Math.PI * 158;
function setRing(v, color) {
  const k = Math.max(0, Math.min(1, v));
  arcEl.style.opacity = k <= 0.001 ? '0' : '1';
  arcEl.style.strokeDashoffset = String(RING_C * (1 - k));
  arcEl.style.stroke = color || 'rgba(201,164,92,.55)';
}
// 实时环必须反映"走到哪了"，不能只算"离轨迹近不近"——
// 否则只画前 30% 也会显示 100%，用户会以为已经完成。
function liveMatch(pt) {
  const t = TALISMANS[S.talisman].strokes[S.done];
  const tmpl = t.map(p => toScreen(p));
  const M = 14;
  let hit = 0, progress = 0;
  for (const p of S.current.pts) {
    let localBest = 0;
    for (let i = 1; i < tmpl.length; i++) {
      const a = tmpl[i-1], c = tmpl[i];
      const dx = c.x-a.x, dy = c.y-a.y, L2 = dx*dx+dy*dy || 1;
      let u = ((p.x-a.x)*dx + (p.y-a.y)*dy) / L2; u = Math.max(0, Math.min(1, u));
      const d = Math.hypot(p.x-(a.x+u*dx), p.y-(a.y+u*dy));
      if (d < M) localBest = Math.max(localBest, (i - 1 + u) / (tmpl.length - 1));
    }
    if (localBest > 0) hit++;
    progress = Math.max(progress, localBest);
  }
  const accuracy = hit / Math.max(1, S.current.pts.length);
  const value = progress * (0.6 + 0.4 * accuracy);
  setRing(value, value < .4 ? 'rgba(237,230,214,.28)' : (value < .72 ? 'rgba(111,191,176,.6)' : 'rgba(201,164,92,.7)'));
}

/* ============ 粒子 ============ */
const particles = [];
function burst(x, y) {
  for (let i = 0; i < 90; i++) {
    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 280;
    const r0 = 6 + Math.random() * 22;
    particles.push({
      x: x + Math.cos(a) * r0, y: y + Math.sin(a) * r0,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 40,
      life: 1, decay: .005 + Math.random()*.008,
      size: .6 + Math.random()*1.8,
      hue: Math.random() < .3 ? '111,191,176' : '255,232,180'
    });
  }
}
function tickParticles(dt) {
  if (!particles.length) return;
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 120*dt; p.vx *= .985; p.vy *= .985;
    p.life -= p.decay;
    if (p.life <= 0) { particles.splice(i,1); continue; }
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba('+p.hue+','+(p.life*.9)+')';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size*p.life, 0, 7); ctx.fill();
  }
}

/* ============ 交互 ============ */
function localPt(e) {
  const r = phone.getBoundingClientRect();
  const sx = 390 / r.width;
  return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * (844 / r.height) };
}
function start(e) {
  if (settle.classList.contains('on')) return;
  const p = localPt(e);
  const t = TALISMANS[S.talisman];
  if (S.done >= t.strokes.length) return;
  const s = toScreen(t.strokes[S.done][0]);
  if (Math.hypot(p.x-s.x, p.y-s.y) > 40) {
    hint.textContent = '从符头的光点起笔'; hint.style.opacity = 1;
    setTimeout(() => hint.style.opacity = .5, 1200);
    return;
  }
  S.current = { pts: [p] };
  S.startedAt = performance.now();
  pet.classList.add('cast');
  hint.style.opacity = 0;
  if (e.pointerId != null) plate.setPointerCapture?.(e.pointerId);
}
function move(e) {
  if (!S.current) return;
  const p = localPt(e), last = S.current.pts[S.current.pts.length-1];
  if (Math.hypot(p.x-last.x, p.y-last.y) < 1.2) return;
  S.current.pts.push(p);
  drawTrail(); liveMatch(p);
  // 眼睛跟随
  const dx = (p.x - 195) / 195, dy = (p.y - 420) / 420;
  eyeL.style.transform = 'translate(' + (dx*3.2) + 'px,' + (dy*2.4) + 'px)';
  eyeR.style.transform = 'translate(' + (dx*3.2) + 'px,' + (dy*2.4) + 'px)';
}
function end() {
  if (!S.current) return;
  const pts = S.current.pts; S.current = null;
  pet.classList.remove('cast');
  const t = TALISMANS[S.talisman].strokes[S.done];
  // 太短：作废
  let len = 0;
  for (let i=1;i<pts.length;i++) len += Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y);
  if (len < 64 || pts.length < 8) {
    const s = toScreen(t[0]); startdot.animate([{transform:'translateX(0)'},{transform:'translateX(4px)'},{transform:'translateX(0)'}],{duration:180});
    ctx.clearRect(0,0,390,844); setRing(0); hint.textContent='松手太早，这一笔作废'; hint.style.opacity=.6;
    return;
  }
  const sc = score(pts, t);
  const pass = sc.total >= S.threshold;
  $('sScore').textContent = sc.total.toFixed(3);
  $('sTime').textContent = ((performance.now()-S.startedAt)/1000).toFixed(1) + 's';
  if (!pass) {
    const near = sc.total >= 0.55;
    hint.textContent = near ? '差一点，重画这一笔' : '偏得有点远，再看一眼虚线';
    hint.style.opacity = .75;
    setRing(sc.total, 'rgba(237,230,214,.55)');
    redraw();
    if (!S.showScore) $('sScore').textContent = near ? '接近' : '未过';
    return;
  }
  // 通过：这一笔定格
  S.strokes.push(pts); S.done++;
  redraw();
  setRing(1);
  if (S.done < TALISMANS[S.talisman].strokes.length) {
    hint.textContent = '继续下一笔'; hint.style.opacity = .5;
    renderGuide(); return;
  }
  finish(sc);
}
function drawDoneStroke(pts) {
  ctx.save(); ctx.globalCompositeOperation='lighter';
  ctx.strokeStyle='rgba(201,164,92,.5)'; ctx.lineWidth=2.4; ctx.lineCap='round';
  ctx.shadowColor='rgba(201,164,92,.6)'; ctx.shadowBlur=10;
  ctx.beginPath(); pts.forEach((p,i)=> i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.stroke();
  ctx.restore();
}
function redraw() {
  ctx.clearRect(0, 0, 390, 844);
  S.strokes.forEach(drawDoneStroke);
  drawTrail();
}

function finish(sc) {
  if (DEMO) document.body.classList.add('still');
  renderGuide();                       // 进度与虚线一次性收尾（3/3、隐藏起笔点）
  hint.style.opacity = 0;
  if (DEMO) flash.style.display = 'none';

  const seal = document.getElementById('seal');
  const ink = document.getElementById('ink');
  if (DEMO) {
    // 截图模式：直接定格在"落印完成"的状态
    seal.style.opacity = '.92';
    seal.style.transform = 'rotate(-6deg) scale(1)';
    ink.style.opacity = '.55';
    ink.style.transform = 'scale(1)';
  } else {
    seal.classList.remove('drop');
    void seal.offsetWidth;
    seal.classList.add('drop');
    ink.classList.remove('bloom');
    void ink.offsetWidth;
    ink.classList.add('bloom');
  }

  const sh = SHICHEN[S.shichen];
  const xp = Math.round(80 * sh.mult * 1.05 * 1.10);
  burst(195, 400);
  if (!DEMO) {
    const fx = flash.animate([{opacity:0},{opacity:.5,offset:.35},{opacity:0}], {duration:420, easing:'ease-out'});
    fx.onfinish = () => { flash.style.opacity = '0'; };
  }
  pet.style.bottom = '344px';
  pet.classList.add('bounce');
  setTimeout(()=>pet.classList.remove('bounce'), 600);
  S.today += xp;
  settle.classList.add('on');
  arcEl.style.opacity = '0.14';          // 收尾：成功环淡出，别一直亮着
  $('rMult').textContent = '×' + sh.mult.toFixed(2);
  $('rShichen').textContent = sh.label;
  $('rToday').textContent = S.today;
  $('sToday').textContent = S.today;
  $('sTotal').textContent = sc.total.toFixed(3);
  $('xpNum').textContent = String(xp);   // 先落终值，动画只在真实浏览器里覆盖
  if (DEMO) return;
  const t0 = performance.now();
  const roll = (t) => {
    const k = Math.max(0, Math.min(1, (t - t0) / 500));
    $('xpNum').textContent = Math.round(xp * (1-Math.pow(1-k,3)));
    if (k < 1) requestAnimationFrame(roll);
  };
  requestAnimationFrame(roll);
}
function reset() {
  S.strokes = []; S.current = null; S.done = 0;
  settle.classList.remove('on');
  pet.style.bottom = '206px';
  arcEl.style.opacity = '0';
  const sealEl = document.getElementById('seal');
  sealEl.classList.remove('drop');
  sealEl.style.opacity = '0';
  sealEl.style.transform = 'rotate(-14deg) scale(2.2)';
  const inkEl = document.getElementById('ink');
  inkEl.classList.remove('bloom');
  inkEl.style.opacity = '0';
  ctx.clearRect(0,0,390,844);
  setRing(0); renderGuide(); hint.style.opacity = .5;
  hint.textContent = '从光点起笔，沿虚线画';
  $('sScore').textContent = '—'; $('sTotal').textContent = '—'; $('sTime').textContent = '—';
}

/* ============ 事件绑定 ============ */
plate.addEventListener('pointerdown', start);
window.addEventListener('pointermove', move);
window.addEventListener('pointerup', end);
window.addEventListener('pointercancel', end);

$('segTalisman').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  [...e.currentTarget.children].forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); S.talisman = +b.dataset.i; reset();
  $('plateName').textContent = TALISMANS[S.talisman].name + ' · 三笔';
});
$('segShichen').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  [...e.currentTarget.children].forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); S.shichen = +b.dataset.i; applyShichen();
});
$('thr').addEventListener('input', e => {
  S.threshold = +e.target.value;
  $('thrVal').textContent = S.threshold.toFixed(2);
  $('sThr').textContent = S.threshold.toFixed(2);
});
$('tScore').addEventListener('click', e => { e.currentTarget.classList.toggle('on'); S.showScore = e.currentTarget.classList.contains('on'); });
$('tGuide').addEventListener('click', e => { e.currentTarget.classList.toggle('on'); S.showGuide = e.currentTarget.classList.contains('on'); renderGuide(); });
$('again').addEventListener('click', reset);
$('close').addEventListener('click', () => settle.classList.remove('on'));

function applyShichen() {
  const sh = SHICHEN[S.shichen];
  $('grade').style.background = sh.grade;
  $('pillText').textContent = sh.label;
  $('pillMult').textContent = '×' + sh.mult.toFixed(1);
  document.querySelector('#pill i').style.background = sh.dot;
}

/* ============ 自检：?demo=1 自动画完整符，用于截图验证 ============ */
function simulateStroke() {
  const t = TALISMANS[S.talisman].strokes[S.done];
  if (!t) return;
  S.startedAt = performance.now();
  // 沿模板密集采样，模拟真实指针轨迹
  const dense = [];
  for (let i = 1; i < t.length; i++) {
    const a = toScreen(t[i-1]), b = toScreen(t[i]);
    const n = Math.max(2, Math.round(Math.hypot(b.x-a.x, b.y-a.y) / 5));
    for (let k = 0; k < n; k++) {
      dense.push({ x: a.x + (b.x-a.x)*k/n + (Math.random()-.5)*1.6,
                   y: a.y + (b.y-a.y)*k/n + (Math.random()-.5)*1.6 });
    }
  }
  dense.push({ x: dense.at(-1).x, y: dense.at(-1).y });
  S.current = { pts: dense };
  drawTrail();
  end();
}

/* ============ 启动 ============ */
let lastT = 0;
function loop(t) {
  const dt = Math.min(.05, (t - lastT) / 1000 || .016); lastT = t;
  tickParticles(dt);
  requestAnimationFrame(loop);
}
renderGuide(); applyShichen(); requestAnimationFrame(loop);

const params = new URLSearchParams(location.search);
if (params.get('clean') === '1') document.body.classList.add('clean');
if (params.has('shichen')) {
  S.shichen = Math.max(0, Math.min(4, Number(params.get('shichen')) || 0));
  [...document.querySelectorAll('#segShichen button')].forEach((b, i) => b.classList.toggle('on', i === S.shichen));
  applyShichen();
}

if (params.get('demo') === '1') {
  // 自动画完整符，停在结算态
  const n = TALISMANS[S.talisman].strokes.length;
  for (let i = 0; i < n; i++) setTimeout(simulateStroke, 400 + i * 450);
}

if (params.get('demo') === 'demo') {
  // 画到一半定格：只画第一笔的前 62%，不抬手，用于验收"画符中"的观感
  setTimeout(() => {
    const t = TALISMANS[S.talisman].strokes[0];
    const dense = [];
    for (let i = 1; i < t.length; i++) {
      const a = toScreen(t[i-1]), b = toScreen(t[i]);
      const n = Math.max(2, Math.round(Math.hypot(b.x-a.x, b.y-a.y) / 5));
      for (let k = 0; k < n; k++) {
        dense.push({ x: a.x + (b.x-a.x)*k/n, y: a.y + (b.y-a.y)*k/n });
      }
    }
    const cut = Math.round(dense.length * 0.62);
    S.current = { pts: dense.slice(0, cut) };
    S.startedAt = performance.now();
    document.body.classList.add('still');
    document.getElementById('hint').style.opacity = 0;
    drawTrail();
    liveMatch(dense[cut - 1]);
  }, 500);
}

// 灵镜：相机开关 / 翻转 / 留影（原型里只是切换取景态，真机接 AVCaptureSession）
(function () {
  const toggle = document.getElementById('camToggle');
  const flip = document.getElementById('camFlip');
  const shot = document.getElementById('camShot');
  let on = false;
  function render() {
    document.body.classList.toggle('cam-on', on);
    flip.hidden = !on; shot.hidden = !on;
    toggle.textContent = on ? '收镜' : '灵镜';
    document.getElementById('hint').style.opacity = on ? 0 : 0.45;
  }
  toggle.onclick = () => { on = !on; render(); };
  document.getElementById('demoStroke').onclick = () => {
    if (typeof simulateStroke === 'function') simulateStroke();
  };
  flip.onclick = () => { /* 真机：切换 AVCaptureDevice position */ };
  shot.onclick = () => {
    const f = document.getElementById('flash');
    f.animate([{ opacity: 0 }, { opacity: 0.55 }, { opacity: 0 }], { duration: 260 });
  };
  if (new URLSearchParams(location.search).get('cam') === '1') { on = true; }
  render();
})();
</script>
