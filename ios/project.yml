name: DailyCultivation
options:
  bundleIdPrefix: com.dailycultivation
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""          # Mac 上填你的 Team ID，或 Xcode 里选 Automatically manage signing
    CODE_SIGN_STYLE: Automatic
packages:
  TalismanKit:
    path: TalismanKit
targets:
  DailyCultivation:
    type: application
    platform: iOS
    sources:
      - path: DailyCultivation
    dependencies:
      - package: TalismanKit
        product: TalismanKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dailycultivation.app
        PRODUCT_NAME: DailyCultivation
        INFOPLIST_FILE: DailyCultivation/Resources/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
